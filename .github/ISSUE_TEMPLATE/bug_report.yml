name: Functional bug with fictional data
description: Reproduce a problem without photos, life records or private exports.
body:
  - type: markdown
    attributes:
      value: "Use invented data only. For suspected privacy or security problems, use the repository's Security tab and private reporting instead."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Commit or source version, OS, Python and Xcode versions where relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal fictional reproduction
      description: Commands and invented input; remove personal paths, credentials and real records.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include only output you have checked for private information.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Disclosure check
      options:
        - label: This report contains no personal photos, life records, credentials or private exports.
          required: true
