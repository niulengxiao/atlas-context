name: Synthetic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      phone: ${{ steps.scope.outputs.phone }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          ATLAS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('ATLAS_BASE', '')
          run = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or os.environ['GITHUB_REF'].startswith('refs/tags/')
          if not base or not base.strip('0'):
              run = True
          elif not run:
              changed = subprocess.check_output(['git', 'diff', '--name-only', base, os.environ['GITHUB_SHA']], text=True).splitlines()
              run = any(p.startswith(('mobile/', '.github/workflows/')) or p.endswith('.swift') or p in {
                  'scripts/create_phone_project.py', 'scripts/test_phone_ui.py', 'atlas_context/phone.py', 'atlas_context/core.py'
              } for p in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('phone=' + str(run).lower() + '\n')
          PY

  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m atlas_context.synthetic --output "$RUNNER_TEMP/atlas-demo"
      - run: python -m atlas_context.phone demo --output "$RUNNER_TEMP/atlas-phone-demo"
      - run: python -m atlas_context.phone demo --scenario personal-assistance --output "$RUNNER_TEMP/atlas-assistance-demo"
      - run: python -m atlas_context.review_demo --output "$RUNNER_TEMP/atlas-review-demo"
      - run: python -m atlas_context.evaluation --output "$RUNNER_TEMP/atlas-evaluation"
      - run: python scripts/check_release.py
      - name: Default README stays English
        run: python -c "import pathlib,re; assert not re.search(r'[\u3400-\u4dbf\u4e00-\u9fff]',pathlib.Path('README.md').read_text())"

  mcp:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[mcp]'
      - name: Installed package works outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m atlas_context.review_demo --output "$RUNNER_TEMP/atlas-installed-review"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py

  phone:
    needs: changes
    if: needs.changes.outputs.phone == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: xcrun swiftc mobile/PhoneBundle.swift mobile/PhotoReflection.swift tests/phone_contract_check.swift -o "$RUNNER_TEMP/phone-contract-check"
      - run: '"$RUNNER_TEMP/phone-contract-check" "$RUNNER_TEMP/private-swift-phone.json" "$RUNNER_TEMP/private-swift-assistance.json"'
      - run: python -c "import sys; from atlas_context.phone import load_bundle; b,_=load_bundle(sys.argv[1]); assert len(b['records'])==2 and b['disclosure']=='local_only'" "$RUNNER_TEMP/private-swift-phone.json"
      - run: python -c "import sys; from atlas_context.phone import load_bundle; b,_=load_bundle(sys.argv[1]); assert b['purpose']=='personal_assistance' and len(b['records'])==2 and all(set(r)=={'text','attribution'} for r in b['records'])" "$RUNNER_TEMP/private-swift-assistance.json"
      - run: xcrun swiftc mobile/PhoneBundle.swift mobile/PhotoReflection.swift mobile/LocalPhotoAnalyzer.swift tests/photo_analysis_check.swift -o "$RUNNER_TEMP/photo-analysis-check"
      - run: '"$RUNNER_TEMP/photo-analysis-check"'
      - run: python scripts/create_phone_project.py --output "$RUNNER_TEMP/atlas-phone-app"
      - run: xcodebuild -quiet -project "$RUNNER_TEMP/atlas-phone-app/AtlasPhoneDemo.xcodeproj" -scheme AtlasPhoneDemo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/atlas-phone-build" CODE_SIGNING_ALLOWED=NO build
      - name: Fictional native review and export interactions
        run: python scripts/test_phone_ui.py --project "$RUNNER_TEMP/atlas-phone-app/AtlasPhoneDemo.xcodeproj" --results "$RUNNER_TEMP/atlas-phone-ui.xcresult" --derived-data "$RUNNER_TEMP/atlas-phone-ui-build"
      - run: python scripts/check_release.py
