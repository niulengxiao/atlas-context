[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "atlas-context"
version = "0.4.1a1"
description = "User-reviewed personal context with bounded local disclosure"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
atlas-context = "atlas_context.cli:main"
atlas-context-mcp = "atlas_context.mcp_server:main"
atlas-context-phone = "atlas_context.phone:main"
atlas-context-review = "atlas_context.review_demo:main"

[project.urls]
Repository = "https://github.com/niulengxiao/atlas-context"

[tool.hatch.build.targets.wheel]
packages = ["atlas_context"]
